services:
  retro-library:
    build: .
    image: retro-library:1.1.1
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-30808}:8080"
    environment:
      APPLE_TV_HOST: "${APPLE_TV_HOST:?Set APPLE_TV_HOST in .env}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-60}"
      METADATA_ENABLED: "${METADATA_ENABLED:-true}"
    volumes:
      - "${LIBRARY_PATH:-./data/library}:/library:rw"
      - "${STATE_PATH:-./data/state}:/state:rw"
    tmpfs:
      - /tmp:size=67108864,mode=1777
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
